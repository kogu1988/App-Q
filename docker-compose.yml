services:
  # --- ASENKRON VERİ VE MESAJ KUYRUĞU KATMANI (REDIS) ---
  redis:
    image: redis:7.2-alpine
    container_name: clarere-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "4006:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- SEMANTİK VE VEKTÖREL VERİTABANI KATMANI (PGVECTOR) ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clarere-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ortam degiskeni zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:-clarere_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 512mb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- META ARAMA MOTORU (SEARXNG) ---
  searxng:
    image: searxng/searxng:latest
    container_name: clarere-searxng
    ports:
      - "4003:8080"
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:4003/
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  # --- MONOLİTİK FASTAPI AĞ API KATMANI ---
  clarere-api:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: clarere-api
    ports:
      - "4000:3000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    restart: unless-stopped

  # --- ASENKRON WORKER (CELERY) ---
  celery_worker:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: clarere-celery-worker
    command: celery -A packages.research_engine.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    restart: unless-stopped

  # --- GOZLEMLENEBILIRLİK (LANGFUSE) --- optional profile ile baslatilir ---
  langfuse-server:
    profiles: ["optional"]
    image: langfuse/langfuse:2
    container_name: clarere-langfuse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4002:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clarere_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clarere_db}?schema=langfuse
      - NEXTAUTH_URL=http://localhost:4002
      - NEXTAUTH_SECRET=clarere_super_secret_langfuse
      - SALT=clarere_salt_for_langfuse
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    restart: "no"

volumes:
  redis_data:
  postgres_data:
  searxng_data:
