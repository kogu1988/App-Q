version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: appq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: appq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:-appq_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app-q:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: app-q
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
