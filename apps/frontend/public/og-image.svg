<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Space+Grotesk:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap');
      
      .logo-display { font-family: 'Space Grotesk', sans-serif; font-size: 110px; font-weight: 600; letter-spacing: -4px; }
      .display-sub { font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 500; letter-spacing: -1.5px; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; }
      .mono { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .meta { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; }
    </style>

    <path id="eye" d="M -100,0 A 125,125 0 0,1 100,0 A 125,125 0 0,1 -100,0 Z" vector-effect="non-scaling-stroke" />
  </defs>

  <rect width="1200" height="630" fill="#ffffff" />

  <g transform="translate(80, 80)">
    <rect width="200" height="36" rx="18" fill="none" stroke="#ff7759" stroke-width="1.5" />
    <circle cx="18" cy="18" r="4" fill="#ff7759" />
    <text x="34" y="23" class="mono" fill="#ff7759">RESEARCH ENGINE</text>
  </g>

  <text x="80" y="240" class="logo-display" fill="#17171c">Clarere.</text>
  <text x="80" y="320" class="display-sub" fill="#212121">Data synthesis.</text>
  <text x="80" y="380" class="display-sub" fill="#212121">Absolute clarity.</text>

  <text x="80" y="460" class="body-text" fill="#616161">AI-powered synthetic personas for unbiased,</text>
  <text x="80" y="495" class="body-text" fill="#616161">deterministic market intelligence.</text>

  <line x1="80" y1="560" x2="580" y2="560" stroke="#e5e7eb" stroke-width="2" />
  <text x="80" y="590" class="meta" fill="#93939f">CLARERE.COM — 2026</text>
  <text x="580" y="590" class="mono" text-anchor="end" fill="#1863dc">SYS_VERSION: ALPHA</text>


  <rect x="640" y="40" width="520" height="550" rx="22" fill="#003c33" />
  
  <line x1="640" y1="100" x2="1160" y2="100" stroke="#edfce9" stroke-width="1" opacity="0.2" />
  <line x1="640" y1="490" x2="1160" y2="490" stroke="#edfce9" stroke-width="1" opacity="0.2" />

  <circle cx="680" cy="70" r="5" fill="#ff7759" />
  <text x="696" y="75" class="meta" fill="#edfce9" opacity="0.8">AGENT_CONSOLE // ACTIVE</text>
  
  <text x="1120" y="530" class="meta" fill="#edfce9" opacity="0.5" text-anchor="end">NEO-PI-R COGNITIVE SYNC</text>

  <line x1="900" y1="100" x2="900" y2="490" stroke="#edfce9" stroke-width="1" opacity="0.08" />
  <line x1="640" y1="295" x2="1160" y2="295" stroke="#edfce9" stroke-width="1" opacity="0.08" />
  
  <g transform="translate(900, 295) scale(2.2)" fill="none" stroke="#edfce9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <use href="#eye" />
    <use href="#eye" transform="rotate(6) scale(0.9245)" />
    <use href="#eye" transform="rotate(-6) scale(0.9245)" />
    <use href="#eye" transform="rotate(12) scale(0.8552)" />
    <use href="#eye" transform="rotate(-12) scale(0.8552)" />
    <use href="#eye" transform="rotate(18) scale(0.7915)" />
    <use href="#eye" transform="rotate(-18) scale(0.7915)" />
    <use href="#eye" transform="rotate(24) scale(0.7332)" />
    <use href="#eye" transform="rotate(-24) scale(0.7332)" />
    <use href="#eye" transform="rotate(30) scale(0.6800)" />
    <use href="#eye" transform="rotate(-30) scale(0.6800)" />
    <circle cx="0" cy="0" r="16" vector-effect="non-scaling-stroke" />
    <circle cx="0" cy="0" r="32" vector-effect="non-scaling-stroke" />
  </g>
  
  <circle cx="900" cy="295" r="3" fill="#ff7759" opacity="0.9" />

</svg>
