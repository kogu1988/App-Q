# Clarere — LOCAL test override (docker-compose.prod.yml üzerine)
# Kullanım: docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
# Caddy'yi localhost:8080 (HTTP) ile değiştirir.

services:
  caddy:
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Frontend'e doğrudan erişim: http://localhost:4001
  # API_PROXY_TARGET BUILD ARG'dır: next.config rewrites derleme anında gömülür
  # (runtime env etkisizdir). /api/* container içinden clarere-api:3000'e gider.
  frontend:
    build:
      context: ./apps/frontend
      args:
        API_PROXY_TARGET: http://clarere-api:3000
    ports:
      - "4001:3000"
