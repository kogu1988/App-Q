name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        env:
          APP_ENV: development
          # DB yok → RLS testi otomatik skip edilir
        run: python -m pytest packages/research_engine/tests/ -q

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present
