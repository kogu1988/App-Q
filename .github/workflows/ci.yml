name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Testleri çalıştır
        env:
          APP_ENV: development
          # DB yok → RLS testi otomatik skip edilir
        run: |
          set -o pipefail
          python -m pytest packages/research_engine/tests/ -q | tee pytest-output.txt

      - name: Test özetini raporla
        if: always()
        run: |
          {
            echo "### Backend test sonucu"
            echo '```'
            tail -n 3 pytest-output.txt 2>/dev/null || echo "çıktı yok"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present
