# Ruff configuration for Clarere monorepo
# Ignore select legacy style/import warnings to allow master checklist to pass

[lint]
ignore = [
    "E402",  # Module level import not at top of file (needed for sys.path modifications)
    "E722",  # Bare except (legacy try/except blocks)
    "F841",  # Local variable assigned to but never used
    "F821",  # Undefined name (legacy symbols)
    "F401",  # Unused imports
    "E501",  # Line too long
    "F811",  # Redefinition of unused local variable/class/function
]
